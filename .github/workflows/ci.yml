name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend checks (no AWS calls)
        run: |
          python -m pip install -r requirements/dev.txt
          python -m unittest discover -s tests/backend -v
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Container build and smoke test (sample graph)
        run: |
          docker build -t twitter-network-analyzer:ci .
          docker run -d --rm --name twitter-network-analyzer-ci -p 127.0.0.1:8000:8000 twitter-network-analyzer:ci --demo
          trap 'docker logs twitter-network-analyzer-ci; docker stop twitter-network-analyzer-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ > /dev/null
          python -c "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/users/200')); assert d == {'user_id':'200','followers':2,'followees':2}, d"

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install pyspark==4.0.1
      - run: python -m unittest discover -s tests/analysis -v

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.0"
      - run: terraform fmt -check
        working-directory: infra
      - run: terraform init -backend=false -input=false
        working-directory: infra
      - run: terraform validate
        working-directory: infra
